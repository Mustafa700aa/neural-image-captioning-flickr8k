
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: image_caption_api
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../checkpoints:/app/checkpoints
      - ../dataset:/app/dataset:ro
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: image_caption_streamlit
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data
      - ../checkpoints:/app/checkpoints
      - ../dataset:/app/dataset:ro
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
    restart: unless-stopped
